name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly bounded run of the fuzz targets (tests/fuzz_test.zig).
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A wedged test must fail the job, not sit on a runner for six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: install zig (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   triple=x86_64-linux ;;
            Linux-ARM64) triple=aarch64-linux ;;
            macOS-ARM64) triple=aarch64-macos ;;
            macOS-X64)   triple=x86_64-macos ;;
            *) echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-${triple}-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/zig"
          curl -fsSL "$url" | tar -xJ -C "$HOME/zig"
          echo "$HOME/zig/zig-${triple}-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: install zig (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip"
          $dst = Join-Path $env:USERPROFILE 'zig'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Invoke-WebRequest -Uri $url -OutFile zig.zip
          Expand-Archive -LiteralPath zig.zip -DestinationPath $dst
          "$dst\zig-x86_64-windows-$env:ZIG_VERSION" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: format check
        run: zig fmt --check build.zig src tests
      - name: ascii punctuation
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if LC_ALL=C grep -rnE $'\xe2\x80[\x93\x94\x98\x99\x9c\x9d\xa2\xa6\xb2]|\xe2\x86[\x90-\x99]|\xc2[\xa0\xb7]' build.zig src tests docs README.md CHANGELOG.md install.sh install.ps1; then
            echo "non-ASCII punctuation found; write it in ASCII" >&2
            exit 1
          fi
      - name: build
        run: zig build
      - name: test
        run: zig build test --summary all
      - name: installer (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: sh tests/installer_test.sh
      - name: installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tests/installer_test.ps1
      - name: powershell parse (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = $false
          foreach ($f in @('install.ps1') + (Get-ChildItem tests -Filter *.ps1 | ForEach-Object { $_.FullName })) {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e)
            if ($e) { Write-Host "$f :"; $e | ForEach-Object { $_.Message }; $bad = $true }
            else { Write-Host "$f parses" }
          }
          if ($bad) { exit 1 }

  backends:
    # Nightly, or dispatched by hand. Runs the backend adapters against the REAL package
    # managers (`zig build test-backends`), which the hermetic `test` step
    # deliberately excludes. Each check is differential against the manager's
    # own output, so the day brew changes a flag or an output shape under an
    # adapter, this goes red here rather than on a machine.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: install zig
        shell: bash
        run: |
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/zig"
          curl -fsSL "$url" | tar -xJ -C "$HOME/zig"
          echo "$HOME/zig/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: seed one formula and one cask
        shell: bash
        # A check with nothing to compare skips on a developer machine and
        # FAILS here, so the seed is what the job needs to have anything to be
        # differential about: one formula installed on request feeds the
        # receipt oracle, one cask feeds the cask-prefix check. The cask is a
        # font, so it needs no GUI. The tap check is the one exception that
        # skips even here: covering it would mean installing from a
        # third-party tap, which this runner deliberately does not do.
        run: |
          brew install --formula tree
          brew install --cask font-fira-code
      - name: test-backends
        run: zig build test-backends --summary all

  backends-linux:
    # Nightly, or dispatched by hand. The Linux package adapters against the REAL apt, dnf
    # (both generations), zypper, pacman and brew, each in its own container
    # (tests/linux_backends_test.sh).
    #
    # The hermetic suite can only assert that an adapter emits a given argv;
    # whether that argv is right, and whether the manager's output parses
    # back, only the real manager can say.
    #
    # The script fails the run on a SKIP, which here means a case the runner
    # could not execute at all. N/A is separate and does not fail it: the
    # name-shape check needs an explicitly-installed package the manifest does
    # not declare, which zypper (its explicit set is a mox-kept ledger) and a
    # stock Debian (it marks nothing manual) can never supply.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Six containers, one of which bootstraps Homebrew from its own installer
    # and clones homebrew-core before it can install anything.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: install zig
        shell: bash
        run: |
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/zig"
          curl -fsSL "$url" | tar -xJ -C "$HOME/zig"
          echo "$HOME/zig/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: adapters against real managers
        run: sh tests/linux_backends_test.sh

  backends-windows:
    # On a push this workflow runs for, nightly, or dispatched by hand. The
    # scoop and winget adapters against the REAL managers
    # (tests/windows_backends_test.ps1): read-only where a manager is present,
    # and on a runner without scoop the fresh-machine case, bootstrapping it
    # from the pinned installer and installing one app through it.
    #
    # This is the only place those adapters meet the real managers, and a
    # schedule runs only from the default branch, so gating it on one would
    # leave every branch that changes them ungated. Dispatch this workflow on
    # such a branch to gate it before merge. A manager missing from the runner
    # skips loudly rather than passing, which fails the job.
    #
    # winget is the exception the runner forces: the image provisions none --
    # it is absent from the published software manifest and from the
    # image-build sources -- and what the Windows Server build leaves behind
    # is an App Installer the image registers or wedges on its own, which
    # nothing here can repair. So the script reports a winget it cannot get
    # an answer out of as n/a rather than as a skip, and scoop, which mox
    # bootstraps itself, carries the job. A winget that does answer is gated
    # like any other manager.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: install zig
        shell: pwsh
        run: |
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip"
          $dst = Join-Path $env:USERPROFILE 'zig'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Invoke-WebRequest -Uri $url -OutFile zig.zip
          Expand-Archive -LiteralPath zig.zip -DestinationPath $dst
          "$dst\zig-x86_64-windows-$env:ZIG_VERSION" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: build
        run: zig build
      - name: adapters against real managers
        shell: pwsh
        run: pwsh -NoProfile -File tests/windows_backends_test.ps1

  fuzz:
    # Nightly, or dispatched by hand. Exercises the fuzz targets (tests/fuzz_test.zig) under a
    # wall-clock bound. Continuous fuzzing (`zig build fuzz --fuzz`) is gated
    # on an upstream Zig 0.16.0 test-runner fix; until then this runs the
    # targets as bounded smoke checks so a regression that crashes them fails
    # the nightly rather than hanging.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: install zig
        shell: bash
        run: |
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/zig"
          curl -fsSL "$url" | tar -xJ -C "$HOME/zig"
          echo "$HOME/zig/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: fuzz (bounded)
        run: timeout 600 zig build fuzz
